server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 ipv6=off valid=10s;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy metrics endpoints to each backend service
    location /api/mono/ {
        set $mono_upstream http://monolithic:3001;
        rewrite ^/api/mono/(.*)$ /$1 break;
        proxy_pass $mono_upstream;
    }
    location /api/ms/ {
        set $ms_upstream http://ms-gateway:3002;
        rewrite ^/api/ms/(.*)$ /$1 break;
        proxy_pass $ms_upstream;
    }
    location /api/hybrid/ {
        set $hybrid_upstream http://hybrid-gateway:3003;
        rewrite ^/api/hybrid/(.*)$ /$1 break;
        proxy_pass $hybrid_upstream;
    }
}
